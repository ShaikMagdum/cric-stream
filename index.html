<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Stream Hub (HLS + DASH)</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Shaka Player Core & UI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/controls.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Main Stage -->
        <main class="player-stage">
            <header class="topbar">
                <div class="stream-info">
                    <h1 id="active-title">Select a Stream</h1>
                    <span id="active-category" class="badge">Offline</span>
                </div>
            </header>

            <!-- Shaka Player Container -->
            <div id="video-container" class="video-wrapper" data-shaka-player-container>
                <video id="player" data-shaka-player autoplay playsinline></video>
                <div id="player-status" class="status-overlay" style="display:none;"></div>
            </div>
        </main>

        <!-- Channel Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Channels & Matches</h2>
                <input type="text" id="search-input" placeholder="Search event or language...">
            </div>
            <div id="channel-container" class="channel-list"></div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
