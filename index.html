<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player - CRICKLY (Spider-Man Edition)</title>
    
    <!-- Using Roboto to match the standard sizing and bold lettering of the original site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Shaka Player for HLS & MPD (DASH) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/controls.min.css">
</head>
<body>
    <div class="player-wrapper">
        <!-- Top Status Bar mimicking cricklylive.pages.dev -->
        <header class="top-bar">
            <div class="match-info">
                <span class="live-indicator"><span class="pulse"></span>LIVE</span>
                <h1 id="match-title">LOADING MATCH... PLEASE WAIT</h1>
            </div>
            <div class="platform-badges">
                <span class="badge blue">ANDROID</span>
                <span class="badge red">DESKTOP</span>
                <span class="badge green">SMART TV</span>
            </div>
        </header>

        <!-- Video Player Stage -->
        <main class="video-stage" data-shaka-player-container>
            <video id="player" data-shaka-player autoplay playsinline></video>
            
            <!-- Ad Overlay mimicking the original template -->
            <button id="skip-ad-btn" style="display:none;">Skip Ad ⏭</button>
            <div id="player-error" class="error-screen" style="display:none;">CONNECTING...</div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
